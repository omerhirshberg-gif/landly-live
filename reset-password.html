<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Reset Password — Landly</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{colors:{brand:'#0038b8',brandDark:'#002a8a',brandLight:'#e0effe'},fontFamily:{heebo:['Heebo','sans-serif']}}}}
</script>
<style>
*{font-family:'Heebo',sans-serif;box-sizing:border-box;}
body{background:#f8fafc;min-height:100vh;}
.inp{width:100%;border:1.5px solid #e2e8f0;border-radius:12px;padding:13px 16px;font-size:16px;font-family:'Heebo',sans-serif;outline:none;transition:border-color .2s;background:#fff;color:#0f172a;min-height:48px;}
.inp:focus{border-color:#0038b8;}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#0038b8;color:#ffffff;font-weight:800;font-size:15px;padding:15px 30px;border-radius:100px;border:none;cursor:pointer;transition:background .2s;width:100%;min-height:50px;}
.btn-primary:hover{background:#002a8a;}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;}
.lang-toggle{font-size:13px;font-weight:700;color:#64748b;border:1.5px solid #e2e8f0;border-radius:100px;padding:7px 14px;cursor:pointer;background:#fff;}
.lang-toggle:hover{border-color:#0038b8;color:#0038b8;}
</style>
</head>
<body>

  <div class="max-w-7xl mx-auto px-5 py-5 flex items-center justify-between">
    <a href="/" class="inline-flex items-center gap-2">
      <img src="/logo.jpg" alt="Landly" class="h-9 w-auto"/>
    </a>
    <button class="lang-toggle" id="langToggleBtn" onclick="toggleLang()">עברית</button>
  </div>

  <div class="flex items-center justify-center px-5" style="min-height:calc(100vh - 100px)">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-lg p-8 sm:p-10">
      <h1 class="text-2xl font-black text-slate-900 mb-1" data-i18n="title">Set New Password</h1>
      <p class="text-sm text-slate-500 mb-7" data-i18n="subtitle">Choose a new password for your account</p>

      <form id="resetForm" class="space-y-4">
        <div>
          <label class="block mb-1.5 text-sm font-bold text-slate-700" data-i18n="passwordLabel">New password</label>
          <input type="password" id="password" required minlength="6" class="inp" autocomplete="new-password"/>
        </div>

        <div>
          <label class="block mb-1.5 text-sm font-bold text-slate-700" data-i18n="confirmLabel">Confirm password</label>
          <input type="password" id="confirmPassword" required minlength="6" class="inp" autocomplete="new-password"/>
        </div>

        <div id="errorBox" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-xl px-4 py-3"></div>

        <button type="submit" id="submitBtn" class="btn-primary mt-2" data-i18n="submitBtn">Update password</button>
      </form>

      <div id="successBox" class="hidden text-center">
        <h2 class="text-xl font-black text-slate-900 mb-2" data-i18n="successTitle">Password updated!</h2>
        <p class="text-sm text-slate-600" data-i18n="successMsg">Taking you to sign in...</p>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script>
const translations = {
  en: {
    pageTitle: 'Reset Password — Landly',
    title: 'Set New Password',
    subtitle: 'Choose a new password for your account',
    passwordLabel: 'New password',
    confirmLabel: 'Confirm password',
    submitBtn: 'Update password',
    submitBtnLoading: 'Updating...',
    successTitle: 'Password updated!',
    successMsg: 'Taking you to sign in...',
    errorMismatch: "Passwords don't match",
    errorLink: 'This link is invalid or expired. Please request a new one.',
    toggleLabel: 'עברית'
  },
  he: {
    pageTitle: 'איפוס סיסמא — Landly',
    title: 'קביעת סיסמא חדשה',
    subtitle: 'בחר/י סיסמא חדשה לחשבון שלך',
    passwordLabel: 'סיסמא חדשה',
    confirmLabel: 'אימות סיסמא',
    submitBtn: 'עדכן סיסמא',
    submitBtnLoading: 'מעדכן...',
    successTitle: 'הסיסמא עודכנה!',
    successMsg: 'מעביר אותך להתחברות...',
    errorMismatch: 'הסיסמאות לא תואמות',
    errorLink: 'הקישור לא תקין או פג תוקף. יש לבקש קישור חדש.',
    toggleLabel: 'English'
  }
};

let currentLang = localStorage.getItem('landly_lang') === 'he' ? 'he' : 'en';

function applyLang(lang){
  currentLang = lang;
  const t = translations[lang];
  document.getElementById('htmlRoot').setAttribute('lang', lang);
  document.getElementById('htmlRoot').setAttribute('dir', lang === 'he' ? 'rtl' : 'ltr');
  document.title = t.pageTitle;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key]) el.textContent = t[key];
  });
  document.getElementById('langToggleBtn').textContent = t.toggleLabel;
  try { localStorage.setItem('landly_lang', lang); } catch(e){}
}

function toggleLang(){ applyLang(currentLang === 'en' ? 'he' : 'en'); }
applyLang(currentLang);

const form = document.getElementById('resetForm');
const errorBox = document.getElementById('errorBox');
const submitBtn = document.getElementById('submitBtn');
const successBox = document.getElementById('successBox');

form.addEventListener('submit', async function(e){
  e.preventDefault();
  errorBox.classList.add('hidden');

  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (password !== confirmPassword) {
    errorBox.textContent = translations[currentLang].errorMismatch;
    errorBox.classList.remove('hidden');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = translations[currentLang].submitBtnLoading;

  // Supabase כבר יצר session זמני אוטומטית כשהמשתמש הגיע מהקישור שבמייל
  const { error } = await supabaseClient.auth.updateUser({ password });

  submitBtn.disabled = false;
  submitBtn.textContent = translations[currentLang].submitBtn;

  if (error) {
    errorBox.textContent = error.message || translations[currentLang].errorLink;
    errorBox.classList.remove('hidden');
    return;
  }

  form.classList.add('hidden');
  successBox.classList.remove('hidden');
  setTimeout(() => { window.location.href = '/login.html'; }, 2000);
});
</script>
</body>
</html>
